# Develop this config beside checkouts of DIE and the extensions: copy this file to
# `.cargo/config.toml` (which git ignores). The paths assume they're checked out beside this
# repository (`../die`, `../die-draw`, ...); cargo reads a relative path here from this
# repository's root.
#
# The patches build against your checkouts rather than GitHub at `main`, so a change to DIE or an
# extension is seen here before it's pushed. Every repository in one build (this one and each
# extension) should patch to the same checkouts, or two die-cores meet. An extension you don't
# have a checkout of can be left out: it then comes from GitHub.

# DIE's crates: every one that resolves from DIE's repository, including the ones only the others
# depend on (die-core, die-render, die-term).
[patch."https://github.com/0xDEADBEE7/die"]
die = { path = "../die/crates/die" }
die-core = { path = "../die/crates/die-core" }
die-render = { path = "../die/crates/die-render" }
die-vim = { path = "../die/crates/die-vim" }
die-term = { path = "../die/crates/die-term" }
die-dev = { path = "../die/apps/die-dev" }
die-test-cap = { path = "../die/tools/test-cap" }

# The terminal engine's sys crate, DIE's crates/die-term-sys. This takes precedence over
# Cargo.toml's patch of the same package, which names DIE's git source: a patch in a
# configuration file wins over one in the manifest.
[patch."https://github.com/uzaaft/libghostty-rs"]
libghostty-vt-sys = { path = "../die/crates/die-term-sys" }

# The extensions, and die-draw, which die-fig and die-markdown draw with.
[patch."https://github.com/0xDEADBEE7/die-draw"]
die-draw = { path = "../die-draw" }

[patch."https://github.com/0xDEADBEE7/die-orchid-client"]
die-orchid-client = { path = "../die-orchid-client" }

[patch."https://github.com/0xDEADBEE7/die-whiteboard"]
die-whiteboard = { path = "../die-whiteboard" }

[patch."https://github.com/0xDEADBEE7/die-jellyfish"]
die-jellyfish = { path = "../die-jellyfish" }

[patch."https://github.com/0xDEADBEE7/die-markdown"]
die-markdown = { path = "../die-markdown" }

[patch."https://github.com/0xDEADBEE7/die-fig"]
die-fig = { path = "../die-fig" }

# Where DIE's own fonts are (`cargo xtask fonts` in the DIE checkout fetches them). die-draw and
# the whiteboard find them here, at run time and as built, and the tests that set text need them.
[env]
DIE_FONT_DIR = { value = "../die/fonts", relative = true }
